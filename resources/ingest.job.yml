# Hourly at :05 UTC: fetch each source, validate it and land it once in the raw volume.
# `intraday` runs beside `ingest`, not after it: display-only bars, so neither task waits on the other.

resources:
  jobs:
    ingest:
      name: ${var.schema_prefix}weather-signal-ingest
      max_concurrent_runs: 1
      # bootstrap runs it once with catch_up=true after the seed, before its last phase unpauses
      parameters:
        - {name: catch_up, default: "false"}
      queue: {enabled: false}
      performance_target: STANDARD
      schedule:
        quartz_cron_expression: "0 5 * * * ?"
        timezone_id: UTC
        pause_status: ${var.schedule_pause}
      email_notifications:
        on_failure: ["${var.owner}"]
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 600
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: ingest
          environment_key: default
          timeout_seconds: 900
          python_wheel_task:
            package_name: weather_signal
            entry_point: weather-signal-ingest
            parameters: [--catalog, "${var.catalog}", --schema-prefix, "${var.schema_prefix}",
                         --secret-scope, "${var.secret_scope}", --p-hours, "${var.p_hours}",
                         --catch-up, "{{job.parameters.catch_up}}"]
        - task_key: intraday
          environment_key: default
          timeout_seconds: 300
          python_wheel_task:
            package_name: weather_signal
            entry_point: weather-signal-intraday
            parameters: [--catalog, "${var.catalog}", --schema-prefix, "${var.schema_prefix}"]
