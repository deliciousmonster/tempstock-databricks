# Hourly at :30 UTC: guard the inputs, refresh the pipeline, score, then check what was written.

resources:
  jobs:
    score:
      name: ${var.schema_prefix}weather-signal-score
      max_concurrent_runs: 1
      queue: {enabled: false}
      performance_target: STANDARD
      schedule:
        quartz_cron_expression: "0 30 * * * ?"
        timezone_id: UTC
        pause_status: ${var.schedule_pause}
      email_notifications:
        on_failure: ["${var.owner}"]
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 1800
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: guard
          environment_key: default
          timeout_seconds: 600
          python_wheel_task:
            package_name: weather_signal
            entry_point: weather-signal-guard
            parameters: [--catalog, "${var.catalog}", --schema-prefix, "${var.schema_prefix}",
                         --as-of, "{{job.trigger.time.iso_datetime}}"]
        - task_key: refresh
          depends_on: [{task_key: guard}]
          timeout_seconds: 1800
          pipeline_task:
            pipeline_id: ${resources.pipelines.weather_signal.id}
        - task_key: score
          depends_on: [{task_key: refresh}]
          environment_key: default
          timeout_seconds: 900
          python_wheel_task:
            package_name: weather_signal
            entry_point: weather-signal-score
            parameters: [--catalog, "${var.catalog}", --schema-prefix, "${var.schema_prefix}",
                         --p-hours, "${var.p_hours}", --as-of, "{{job.trigger.time.iso_datetime}}"]
        - task_key: check
          depends_on: [{task_key: score}]
          environment_key: default
          timeout_seconds: 600
          python_wheel_task:
            package_name: weather_signal
            entry_point: weather-signal-check
            parameters: [--catalog, "${var.catalog}", --schema-prefix, "${var.schema_prefix}",
                         --p-hours, "${var.p_hours}", --as-of, "{{job.trigger.time.iso_datetime}}"]
