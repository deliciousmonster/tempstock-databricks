[project]
name = "weather-signal"
version = "0.1.0"
description = "Weather and WMT prices into Databricks, scored hourly into an append-only signal. Personal, non-commercial demo."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "deliciousmonster" }]
dependencies = [
    "databricks-sdk>=0.60",
    "requests>=2.31",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "mlflow-skinny>=3.14",
]

[project.optional-dependencies]
# The hourly agent on the Mac; the jobs' wheel environment never installs it.
agent = [
    "crewkit[agent-sdk,databricks]>=0.16.2",
    "claude-agent-sdk==0.2.183",
    "anyio>=4",
    # mlflow.anthropic.autolog() imports it; the agent makes no direct API call.
    "anthropic>=0.40",
]
# `weather-signal-mcp`, the local MCP server over the App's read functions.
mcp = ["mcp>=1.2", "sqlglot>=30"]

[project.urls]
Repository = "https://github.com/deliciousmonster/tempstock-databricks"

[project.scripts]
weather-signal = "weather_signal.cli:main"
weather-signal-ingest = "weather_signal.jobs.ingest:main"
weather-signal-intraday = "weather_signal.jobs.intraday:main"
weather-signal-guard = "weather_signal.jobs.score:guard_main"
weather-signal-score = "weather_signal.jobs.score:score_main"
weather-signal-check = "weather_signal.jobs.score:check_main"
weather-signal-ui-snapshot = "weather_signal.jobs.snapshot:main"
# Needs the `mcp` extra: pip install 'weather-signal[mcp]'.
weather-signal-mcp = "weather_signal.serving.mcp_server:main"
weather-signal-backtest = "weather_signal.jobs.backtest:main"
weather-signal-train = "weather_signal.jobs.train:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6",
    "jsonschema>=4.23",
    "exchange-calendars>=4.11",
    "types-requests",
    "types-PyYAML",
    "pandas-stubs",
    # tests/unit/mcp and the SQL gate hook run against the mcp extra.
    "weather-signal[mcp]",
]
spark = ["pyspark==4.0.*"]
# app/requirements.txt plus the test client, so `uv run pytest` collects tests/app.
app = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
connect = ["databricks-connect==17.3.*"]

[tool.uv]
default-groups = ["dev", "spark", "app"]
conflicts = [[{ group = "spark" }, { group = "connect" }]]

[tool.uv.sources]
crewkit = { git = "https://github.com/deliciousmonster/crewkit.git", tag = "v0.16.2" }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_signal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the dev workspace through Databricks Connect",
    "live: spends Claude calls or touches launchd on this Mac",
]
addopts = "-p no:cacheprovider --strict-markers"
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The crew record holds evidence scripts, not product code.
extend-exclude = ["agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S110", "G", "T20", "A", "RUF100"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
# The pipeline runtime binds `spark`.
"src/weather_signal_etl/**" = ["F821"]

[tool.mypy]
python_version = "3.12"
files = ["src/weather_signal", "app/ws_ui"]
# Pipeline source, run by the pipeline runtime that binds `spark`; tests/spark covers it.
exclude = ["^src/weather_signal_etl/"]
ignore_missing_imports = true
warn_unused_ignores = true
